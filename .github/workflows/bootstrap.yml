name: Bootstrap committed source

on:
  push:
    branches: [main]
    paths: [roam-source.tar.gz]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor == 'Dhairya1611'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact local commit
        run: |
          test -f roam-source.tar.gz
          tar -xzf roam-source.tar.gz
          rm roam-source.tar.gz
          rm .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Roam source and Pages workflow"
          git push
